# Services the test suites need, for local runs:
#   docker compose -f docker-compose.test.yml up -d
# CI starts the same images as job service containers (.github/workflows/ci.yml).
name: email-assistant-test

services:
  # Already running a local mongod on 27017? Skip this one: `up -d greenmail`.
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]

  # IMAP (3143) and SMTP (3025) test server. Auth is disabled: any login creates
  # its mailbox on first use, so every test can use its own address.
  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
