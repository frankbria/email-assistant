# Read by the gitleaks pre-commit hook (.pre-commit-config.yaml).
[extend]
useDefault = true

# The generic-api-key rule reads a Python annotation as a secret: in
# `signing_key: Ed25519PrivateKey = SIGNING_KEY` the "secret" is the type name.
# Skip only lines that are nothing but such a declaration (one parameter or attribute
# whose default is an ALL_CAPS constant name), so a literal elsewhere on the line is still scanned.
[[allowlists]]
description = "Python annotated default that names a constant"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?m)^[ \t]*\w+:[ \t]*[A-Z][A-Za-z0-9]*(?:\[[\w., |]*\])?[ \t]*=[ \t]*[A-Z_][A-Z0-9_]*[ \t]*,?[ \t]*$''']
