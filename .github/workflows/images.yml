name: Images
# Builds both images on every PR (proves the Dockerfiles). On main, pushes the immutable
# :<sha> tag for each (deploys pin IMAGE_TAG=<sha>), then moves the :latest convenience
# tags once both built. Re-running an unchanged commit reuses the cache and the digests.
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/images.yml"]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One publish run at a time on main; promote also skips commits that are no longer main's head.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: backend
            context: .  # needs packages/mailbox-contract
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # The frontend bakes the browser-facing API URL in; set the PUBLIC_API_BASE repo variable.
          build-args: NEXT_PUBLIC_API_BASE=${{ vars.PUBLIC_API_BASE || 'http://localhost:8000' }}
          tags: ghcr.io/frankbria/email-assistant-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    # Moves :latest only after both images built, and only for main's current head.
    # Two registry tags can't move atomically; pin IMAGE_TAG=<sha> for coupled deploys.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Skip if a newer commit is on main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "current=$([ "$head" = "${{ github.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.head.outputs.current == 'true'
        name: Tag both images latest
        run: |
          for service in backend frontend; do
            image=ghcr.io/frankbria/email-assistant-$service
            docker buildx imagetools create --tag "$image:latest" "$image:${{ github.sha }}"
          done
