name: Images
# Builds both images on every PR (proves the Dockerfiles), and pushes them to GHCR on
# main. Re-running on an unchanged commit reuses the layer cache and pushes the same digests.
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/images.yml"]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          # The frontend bakes the browser-facing API URL in; set the PUBLIC_API_BASE repo variable.
          build-args: NEXT_PUBLIC_API_BASE=${{ vars.PUBLIC_API_BASE || 'http://localhost:8000' }}
          tags: |
            ghcr.io/frankbria/email-assistant-${{ matrix.service }}:latest
            ghcr.io/frankbria/email-assistant-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
