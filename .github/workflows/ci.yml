name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mongo-probe:  # temporary evidence for #105; removed before merge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["8", "8.3", "9"]
    steps:
      - run: uname -r; cat /etc/os-release | head -2; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - run: |
          docker run -d --name mongo-probe mongo:${{ matrix.tag }}
          docker image inspect mongo:${{ matrix.tag }} --format '{{index .RepoDigests 0}}'
          for i in $(seq 30); do docker exec mongo-probe mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null && break; sleep 2; done
          docker logs mongo-probe 2>&1 | grep -E 'SERVER-121912|cannot start|"Waiting for connections"|buildInfo' | head -5
          docker exec mongo-probe mongosh --quiet --eval 'db.version()'
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        # Fail the job at startup if mongod dies, instead of 30 s server-selection waits per test.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-retries 12
      greenmail:  # IMAP/SMTP test server, same as docker-compose.test.yml
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ["3025:3025", "3143:3143"]
      greenmail-auth:  # authentication on, for login-failure tests
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=bridge:test@test.example
        ports: ["3026:3025", "3144:3143"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag upstream
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . ../packages ../plugins
      - name: ruff format
        run: uv run ruff format --check . ../packages ../plugins
      - name: mypy
        run: uv run mypy app ../packages/mailbox-contract/src ../packages/imap-mailbox/src ../plugins/proton/src ../plugins/gmail/src
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run

  e2e:
    # Playwright against the real stack (frontend/playwright.config.ts starts FastAPI and Next itself).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-retries 12
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ["3025:3025", "3143:3143"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag upstream
        with:
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: playwright
        run: npm run e2e
        working-directory: frontend
      - name: upload playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
