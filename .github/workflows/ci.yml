name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # shortcut: mongod refuses to start on ubuntu-24.04's 7.0 kernel (SERVER-121912);
    # move back to ubuntu-latest once a MongoDB release accepts fixed kernels.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        # Fail the job at startup if mongod dies, instead of 30 s server-selection waits per test.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag upstream
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . ../packages
      - name: mypy
        run: uv run mypy app ../packages/mailbox-contract/src
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run
