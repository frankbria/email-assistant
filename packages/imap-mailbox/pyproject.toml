[project]
name = "imap-mailbox"
version = "0.1.0"
description = "Reference mailbox/1 MCP plugin over IMAP/SMTP; the base of the Proton and Gmail plugins."
requires-python = ">=3.14"
dependencies = ["anyio", "mailbox-contract", "mcp>=2.3", "pydantic>=2", "pydantic-settings>=2"]

[project.scripts]
imap-mailbox-plugin = "imap_mailbox.server:main"

[tool.uv.sources]
mailbox-contract = { path = "../mailbox-contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../../backend/pyproject.toml"  # one lint/format config for the whole Python tree
