[project]
name = "email-assistant-backend"
version = "0.1.0"
description = "Backend API for an AI email assistant that processes emails, classifies them, and generates actionable task cards."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "beanie>=2",
    "en-core-web-sm",  # spaCy's small English model, for names in redacted_cloud (app/pipeline/redact.py)
    "fastapi",
    "httpx",
    "httpx2>=2.16.0",
    "gmail-mailbox-plugin",  # started over stdio by the app, so the image must contain it
    "mailbox-contract",
    "mcp>=2.3.0",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.19.0",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "spacy>=3.8.18",
    "uvicorn",
]

[dependency-groups]
dev = [
    "imap-mailbox",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "proton-mailbox-plugin",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Live tests call paid APIs: opt in with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
# Dump every thread's traceback when a test hangs.
faulthandler_timeout = 60
markers = [
    "integration: live tests against paid external APIs; skipped unless run with -m integration",
    "dependency: mark tests with dependencies",
    "per: mark tests for performance testing (deselect with '-m \"not per\"')",
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
]
pythonpath = ["."]

[tool.ruff]
# The codebase's de facto width: churn from `ruff format` flattens out here (p99 line is ~130 chars).
line-length = 140

[tool.ruff.lint]
# Pinned: ruff 0.17 widened its default rule set.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design, not per call.
extend-immutable-calls = ["fastapi.Depends"]

[tool.uv.sources]
mailbox-contract = { path = "../packages/mailbox-contract", editable = true }
imap-mailbox = { path = "../packages/imap-mailbox", editable = true }
proton-mailbox-plugin = { path = "../plugins/proton", editable = true }
gmail-mailbox-plugin = { path = "../plugins/gmail", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# Beanie's Document derives from lazy_model.LazyModel, which ships no py.typed: unanalysed it is Any, and so is
# every classmethod a Document inherits (model_validate returned Any instead of the model).
module = ["lazy_model", "lazy_model.*"]
follow_untyped_imports = true
