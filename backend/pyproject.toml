[project]
name = "email-assistant-backend"
version = "0.1.0"
description = "Backend API for an AI email assistant that processes emails, classifies them, and generates actionable task cards."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "beanie>=2",
    "fastapi",
    "httpx",
    "httpx2>=2.16.0",
    "mailbox-contract",
    "mcp>=2.3.0",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.19.0",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "imap-mailbox",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "proton-mailbox-plugin",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Live tests call paid APIs: opt in with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
# Dump every thread's traceback when a test hangs.
faulthandler_timeout = 60
markers = [
    "integration: live tests against paid external APIs; skipped unless run with -m integration",
    "dependency: mark tests with dependencies",
    "per: mark tests for performance testing (deselect with '-m \"not per\"')",
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
]
pythonpath = ["."]

[tool.ruff.lint]
# Pinned: ruff 0.17 widened its default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
mailbox-contract = { path = "../packages/mailbox-contract", editable = true }
imap-mailbox = { path = "../packages/imap-mailbox", editable = true }
proton-mailbox-plugin = { path = "../plugins/proton", editable = true }

[tool.mypy]
plugins = ["pydantic.mypy"]
