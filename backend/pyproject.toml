[project]
name = "email-assistant-backend"
version = "0.1.0"
description = "Backend API for an AI email assistant that processes emails, classifies them, and generates actionable task cards."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie<2",
    "fastapi",
    "httpx",
    "motor",
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Dump every thread's traceback when a test hangs.
faulthandler_timeout = 60
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "dependency: mark tests with dependencies",
    "per: mark tests for performance testing (deselect with '-m \"not per\"')",
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
]
pythonpath = ["."]

[tool.ruff.lint]
# Pinned: ruff 0.17 widened its default rule set.
select = ["E4", "E7", "E9", "F"]
