# Production stack: FastAPI backend + Next.js frontend.
# MongoDB is Atlas by default (MONGODB_URI). `--profile local-mongo` adds a MongoDB
# container instead; then set MONGODB_URI=mongodb://mongo:27017.
# Ports are configurable because the host is shared; check for conflicts first.
# Ports bind to BIND_ADDRESS only (default 127.0.0.1): Docker's published ports bypass
# host firewalls such as UFW, so never bind to 0.0.0.0 on a host with a public interface.
name: email-assistant

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/frankbria/email-assistant-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI (Atlas, or mongodb://mongo:27017 with --profile local-mongo)}
      MONGODB_DB: ${MONGODB_DB:-email_assistant}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3200}
      API_ENVIRONMENT: production
      # JWT issuer/audience = the public frontend URL; keys are fetched over the Compose network.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${FRONTEND_ORIGIN:-http://localhost:3200}}
      BETTER_AUTH_JWKS_URL: http://frontend:3200/api/auth/jwks
      # The owner's per-verb permissions, editable on the host in ./config (see docs/deployment.md).
      PERMISSIONS_FILE: /app/config/permissions.yaml
    volumes:
      - ./config:/app/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
    image: ghcr.io/frankbria/email-assistant-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-email_assistant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${FRONTEND_ORIGIN:-http://localhost:3200}}
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3200}:3200"

  mongo:
    image: mongo:8
    profiles: [local-mongo]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
