[project]
name = "gmail-mailbox-plugin"
version = "0.1.0"
description = "mailbox/1 plugin for Gmail over IMAP/SMTP with an app password."
requires-python = ">=3.14"
dependencies = ["imap-mailbox", "mailbox-contract", "mcp>=2.3", "pydantic-settings>=2"]

[project.scripts]
gmail-plugin = "gmail_plugin.server:main"

[tool.uv.sources]
imap-mailbox = { path = "../../packages/imap-mailbox", editable = true }
mailbox-contract = { path = "../../packages/mailbox-contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_plugin"]
