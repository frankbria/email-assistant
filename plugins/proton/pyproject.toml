[project]
name = "proton-mailbox-plugin"
version = "0.1.0"
description = "mailbox/1 plugin for Proton Mail through Proton Mail Bridge."
requires-python = ">=3.13"
dependencies = ["imap-mailbox", "mailbox-contract", "mcp>=2.3", "pydantic-settings>=2", "uvicorn"]

[project.scripts]
proton-mailbox-plugin = "proton_plugin.server:main"

[tool.uv.sources]
imap-mailbox = { path = "../../packages/imap-mailbox", editable = true }
mailbox-contract = { path = "../../packages/mailbox-contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/proton_plugin"]
